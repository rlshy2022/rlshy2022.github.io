<script>
/* 逻辑部分保持不变 */
function renderLoveCalendar() {
  const calendarBox = document.getElementById('love-calendar-container');
  const listBox = document.getElementById('anniversary-list');
  if (!calendarBox || !listBox) return;

  const EVENTS = [
    { name: "认识纪念日 ❤️", month: 8, day: 18 },
    { name: "欢欢生日 🎂", month: 3, day: 11 },
    { name: "怡怡生日 🎁", month: 7, day: 6 },
  ];

  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const today = now.getDate();

  // 渲染日历
  let firstDay = new Date(year, month, 1).getDay();
  let daysInMonth = new Date(year, month + 1, 0).getDate();
  let calHtml = `<div style="font-size: 1.8rem; text-align: center; margin-bottom: 25px; color: #FF9EAC; font-weight: bold; font-family: 'ZCOOL KuaiLe';">${year} 年 ${month + 1} 月</div>`;
  calHtml += `<table style="width: 100%; text-align: center; font-size: 1.1rem;"><thead><tr style="color: #FF9EAC;"><th>日</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th></tr></thead><tbody><tr>`;
  
  for (let i = 0; i < firstDay; i++) calHtml += '<td></td>';
  for (let d = 1; d <= daysInMonth; d++) {
    if ((firstDay + d - 1) % 7 === 0 && d !== 1) calHtml += '</tr><tr>';
    const isEvent = EVENTS.some(e => e.month === (month + 1) && e.day === d);
    const isToday = (d === today);
    let cls = isEvent ? 'cal-event-day' : (isToday ? 'cal-today-circle' : '');
    calHtml += `<td><span class="${cls}" style="display:inline-block; width:38px; height:38px; line-height:38px;">${d}</span></td>`;
  }
  calHtml += '</tr></tbody></table>';
  calendarBox.innerHTML = calHtml;

  // 渲染倒计时
  let listHtml = '';
  EVENTS.map(e => {
    let target = new Date(year, e.month - 1, e.day);
    if (target < new Date().setHours(0,0,0,0)) target.setFullYear(year + 1);
    e.diff = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
    return e;
  }).sort((a, b) => a.diff - b.diff).forEach(item => {
    listHtml += `<div class="anniversary-item"><span>${item.name}</span><span style="color:#FF7E93; font-weight:bold;">还有 ${item.diff} 天</span></div>`;
  });
  listBox.innerHTML = listHtml;
}

// 确保 PJAX 兼容
renderLoveCalendar();
document.addEventListener('pjax:complete', renderLoveCalendar);
